<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/index.css">
    <link rel="stylesheet" href="style/bg.css">
    <link rel="stylesheet" href="style/setting-drawer.css">

    <script src="script/rotate.js" defer></script>
    <script src="script/drawer-list.js" type="module" defer></script>
    <title>SekaiRotate</title>
</head>

<body>
    <main>
        <div class="main-character" id="mainCharacter">
            <img src="image/emu.png" alt="emu" class="character" id="character">
        </div>

        <button class="settings-btn-open" id="settingsBtnOpen">
            <span class="settings-icon"></span>
        </button>
        <div class="drawer-overlay" id="drawerOverlay"></div>
        <div class="settings-drawer" id="settingsDrawer">
            <div class="drawer-header" id="drawerHeader">
                <h3 class="settings-title">Character</h3>
                <button class="settings-btn-close" id="settingsBtnClose">x</button>
            </div>
            <div class="drawer-list" id="drawerList"></div>
        </div>
    </main>
</body>

</html>
