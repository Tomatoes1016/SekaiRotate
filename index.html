<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
    </script>
    <script type="module">
        import '@material/web/all.js';
        import { styles as typescaleStyles } from '@material/web/typography/md-typescale-styles.js';

        document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>

    <link rel="stylesheet" href="./assets/css/main.css">
    <link rel="stylesheet" href="./assets/css/drawer.css">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <script src="./assets/js/audio.js" defer></script>
    <script src="./assets/js/rotate.js" defer></script>
    <script src="./assets/js/drawer.js" defer></script>
    <script type="module" src="./assets/js/material-color.js"></script>

    <title>SekaiRotate</title>
</head>

<body>
    <main>
        <div class="main-character" id="mainCharacter">
            <div class="character-overlay" id="characterOverlay"></div>
            <img src="./assets/images/emu.png" alt="emu" class="character" id="character">
        </div>

        <md-fab class="settings-fab" id="settingsFab" aria-label="Settings">
            <svg xmlns="http://www.w3.org/2000/svg" slot="icon" width="24" height="24" viewBox="0 0 24 24"

            </svg>
        </md-fab>

        <div class="drawer-overlay" id="drawerOverlay"></div>
        <md-dialog class="drawer" id="drawer">
            <div slot="headline">Character</div>
            <form slot="content" id="drawerOptions"></form>
            <div slot="actions">
                <md-outlined-button class="drawer-btn" id="drawerBtn">OK</md-outlined-button>
            </div>
        </md-dialog>
    </main>
</body>

</html>
